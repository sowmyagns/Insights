<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Insights Iva Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <div class="bg-shapes" aria-hidden="true"></div>

    <main class="auth-page">
      <div class="card">
        <div class="logo">
          <svg width="64" height="40" viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="64" height="40" rx="8" fill="#0b3a66"/>
            <path d="M12 26c6-8 20-8 26 0" stroke="#5fd0a4" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>

        <h1 class="title">Insights Iva Admin Portal</h1>
        <p class="subtitle">Super Admin sign in</p>

        <form class="signin" onsubmit="return onSubmit(event)">
          <label class="field-label">Company Email</label>
          <div class="input-row">
            <span class="icon">📧</span>
            <input id="email" type="email" placeholder="Enter your company email" required />
          </div>

          <label class="field-label">Password</label>
          <div class="input-row">
            <span class="icon">🔒</span>
            <input id="password" type="password" placeholder="Enter your password" required />
            <button type="button" class="eye" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
          </div>

          <button class="btn-continue" type="submit">Continue <span class="arrow">→</span></button>

          <p class="footer-link">Company users? <a href="#">Sign in here</a></p>
        </form>
      </div>
    </main>

    <script src="scripts/login.js"></script>
  </body>
</html>
